name: food_express
description: App móvil de Food Express — cliente y repartidor.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  geolocator: ^14.1.1
  url_launcher: ^6.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  google_maps_flutter: ^2.19.0
  shared_preferences: ^2.5.6
  encrypt: ^5.0.3
  flutter_secure_storage: 11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/    
    - assets/images/restaurantes/
    - assets/images/productos/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_food_express.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_food_express.png"
  adaptive_icon_foreground_inset: 20
  web:
    generate: true
    image_path: "assets/images/logo_food_express.png"
    background_color: "#FFFFFF"
    theme_color: "#0AA89A"